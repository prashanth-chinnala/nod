packages:
  - "apps/web"
  - "packages/*"

# pnpm blocks dependency install scripts by default, which is correct -- it is what makes a
# malicious transitive postinstall harder. These three are named individually because each
# genuinely compiles a native binary, and a blanket allow would defeat the point.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - "@tailwindcss/oxide"
