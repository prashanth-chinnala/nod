[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar"
version = "0.1.0"
description = "Real-time conversational avatar prototype — session orchestration, streaming, and a swappable talking-head renderer"
requires-python = ">=3.11"

# Deliberately empty. The orchestration layer has no third-party runtime
# dependencies, which is what lets CI run it with no GPU and no model weights.
# Transport (M3) and the real renderer (M2) add their own optional extras.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]
# The real interviewer. Small install; needs ANTHROPIC_API_KEY at runtime.
llm = [
  "anthropic>=0.120",
  "openai>=2.0",
]
# Deepgram Aura TTS over plain HTTP. httpx only — no vendor SDK needed for one endpoint.
tts = [
  "httpx>=0.27",
]
# Silero VAD. A ~2GB install for a ~2MB model, which is why it is opt-in and why the
# default detector needs nothing at all.
vad = [
  "torch>=2.0",
  "torchaudio>=2.0",
]
# Kept out of [dev] so CI never needs a web stack to lint the state machine. The
# codec and the Transport implementation are tested with a list standing in for the
# socket, so nothing in `tests/` imports these.
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/avatar"]

# CI installs only [dev], which has no web stack, so fastapi is absent when mypy
# runs there. Suppressing the missing import keeps the type check on the modules
# that matter rather than forcing a web dependency into CI to satisfy the linter.
# CI installs only [dev], so every optional extra is absent when mypy runs there. Each of
# these is imported inside the function that needs it, behind a try/except that raises an
# actionable "pip install -e '.[extra]'" message -- so an unresolvable stub here is the
# intended state, not a missing dependency. Listing them is what keeps the type check on
# the orchestration layer that matters rather than forcing a web, ML, and vendor-SDK stack
# into CI to satisfy the linter.
[[tool.mypy.overrides]]
module = [
  "fastapi.*",
  "starlette.*",
  "uvicorn.*",
  "torch.*",
  "websockets.*",
  "httpx.*",
  "openai.*",
  "anthropic.*",
]
ignore_missing_imports = true

# Consequence of the above: with fastapi unresolved, its decorators are Any, and
# strict mode rejects those. Scoped to this one module so the relaxation cannot
# spread to the orchestration layer.
[[tool.mypy.overrides]]
module = "avatar.server"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "gpu: requires a GPU and model weights; excluded from CI via -m 'not gpu'",
]
