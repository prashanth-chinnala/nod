[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar"
version = "0.1.0"
description = "Real-time conversational avatar prototype — session orchestration, streaming, and a swappable talking-head renderer"
requires-python = ">=3.11"

# Deliberately empty. The orchestration layer has no third-party runtime
# dependencies, which is what lets CI run it with no GPU and no model weights.
# Transport (M3) and the real renderer (M2) add their own optional extras.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]
# M3. Kept out of [dev] so CI never needs a web stack to lint the state machine.
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/avatar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "gpu: requires a GPU and model weights; excluded from CI via -m 'not gpu'",
]
