[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar"
version = "0.1.0"
description = "Real-time conversational avatar prototype — session orchestration, streaming, and a swappable talking-head renderer"
requires-python = ">=3.11"

# Deliberately empty. The orchestration layer has no third-party runtime
# dependencies, which is what lets CI run it with no GPU and no model weights.
# Transport (M3) and the real renderer (M2) add their own optional extras.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]
# The real interviewer. Small install; needs ANTHROPIC_API_KEY at runtime.
llm = [
  "anthropic>=0.120",
  "openai>=2.0",
]
# Deepgram Aura TTS over plain HTTP. httpx only — no vendor SDK needed for one endpoint.
tts = [
  "httpx>=0.27",
]
# Chroma Cloud retrieval. Opt-in: the default retriever is keyword-based, in-process, and
# needs neither. The client also downloads a ~79MB ONNX embedding model on first use, which
# is a further reason not to make it a base dependency.
vector = [
  "chromadb>=1.0",
]
# WebRTC transport via LiveKit. Optional: the WebSocket transport needs none of it, and a
# clean clone runs without an SFU.
webrtc = [
  "livekit>=1.0",
  "livekit-api>=1.0",
  "pillow>=10.0",
]
# Silero VAD. A ~2GB install for a ~2MB model, which is why it is opt-in and why the
# default detector needs nothing at all.
vad = [
  "torch>=2.0",
  "torchaudio>=2.0",
]
# The Postgres backing for the resource store, and the one-off import in
# scripts/migrate_to_postgres.py. Optional because `dependencies = []` is what lets CI run with
# no services: the default store is still the JSON files, and AVATAR_STORE=postgres is what asks
# for this. `[binary]` ships a wheel with libpq in it, so installing needs no pg_config and no
# compiler -- the source build is the version of this that fails on somebody's laptop.
postgres = [
  "psycopg[binary]>=3.1",
]
# Kept out of [dev] so CI never needs a web stack to lint the state machine. The
# codec and the Transport implementation are tested with a list standing in for the
# socket, so nothing in `tests/` imports these.
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # Required by FastAPI for `Form`/`UploadFile`, which the face upload uses. In `[server]` rather
  # than `[dev]` because it is a serving concern -- and note it is needed at *import* of
  # `api/faces.py`, not at request time, so without it the whole router fails to load and the test
  # modules that import it error during collection rather than skipping.
  "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

# Ship the PEP 561 marker, so a consumer's type checker uses these annotations instead of
# treating everything from `avatar` as Any. `apps/assistant` imports `avatar.store`, and without
# this its own strict mypy reported every store call as returning Any -- an error about the
# absence of a marker file, which reads as an error about the calling code.
[tool.setuptools.package-data]
avatar = ["py.typed"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# `server.py` calls `config.load_env()` above its `avatar` imports, on purpose: `avatar.store`
# chooses its backend from AVATAR_STORE at import time and the routers pull it in transitively, so
# loading the env files after them read the variable too late — the API served JSON files while
# reporting no error. Nineteen `noqa` comments would say the same thing nineteen times; this says
# it once, where a reader looking for the rule will find it.
"src/avatar/server.py" = ["E402"]

[tool.ruff.lint]
# En dash, em dash and typographic quotes are intentional in prose. RUF001/RUF002 exist to
# catch homoglyphs pasted from elsewhere; mangling real punctuation to satisfy them would
# make the writing worse, which is the opposite of the point.
allowed-confusables = ["–", "—", "‘", "’", "“", "”"]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/avatar"]

# CI installs only [dev], which has no web stack, so fastapi is absent when mypy
# runs there. Suppressing the missing import keeps the type check on the modules
# that matter rather than forcing a web dependency into CI to satisfy the linter.
# CI installs only [dev], so every optional extra is absent when mypy runs there. Each of
# these is imported inside the function that needs it, behind a try/except that raises an
# actionable "pip install -e '.[extra]'" message -- so an unresolvable stub here is the
# intended state, not a missing dependency. Listing them is what keeps the type check on
# the orchestration layer that matters rather than forcing a web, ML, and vendor-SDK stack
# into CI to satisfy the linter.
[[tool.mypy.overrides]]
module = [
  "fastapi.*",
  "starlette.*",
  "uvicorn.*",
  "torch.*",
  "websockets.*",
  "httpx.*",
  "openai.*",
  "anthropic.*",
  "PIL.*",
  "cv2.*",
  "musetalk.*",
  "livekit.*",
  "psycopg.*",
  # `pydantic` was missing, and its absence is why 8 of the 101 CI errors were
  # `import-not-found`: every console router imports it at module scope, and CI installs only
  # `[dev]`. Locally it arrives with `[server]`, so the whole class was invisible to anyone who
  # had run the app.
  "pydantic.*",
]
ignore_missing_imports = true

# Consequence of the above: with fastapi unresolved, its decorators are Any, and
# strict mode rejects those. Scoped to this one module so the relaxation cannot
# spread to the orchestration layer.
# numpy and chromadb arrive via the optional [vector] extra and are never type-checked here.
# torch, face_alignment, transformers and MuseTalk's own modules are the same case, one step
# further out: they are not in any extra at all, because they are installed into a separate
# Python 3.10 environment (`.venv-musetalk`) that CI never builds. Every import of them is
# function-scoped, so `import avatar` stays torch-free -- which tests/test_boundaries.py
# enforces, and which is why declaring them unresolvable here costs nothing.
[[tool.mypy.overrides]]
module = [
  "numpy.*",
  "chromadb.*",
  "face_alignment.*",
  "transformers.*",
  "musetalk.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# `avatar.server` *and* the eight routers beside it. Scoped to the server alone, this relaxation
# left 65 `untyped-decorator` errors in `avatar/api/*.py`: those modules use the same
# `@router.get`/`@router.post` decorators, and with fastapi absent -- which is exactly what CI
# installs -- the decorator resolves to `Any` and mypy calls every handler untyped. Invisible
# locally, because `[server]` brings fastapi and the decorators then have real types.
module = ["avatar.server", "avatar.api.*"]
disallow_untyped_decorators = false
# `BaseModel` is `Any` when pydantic is absent, and strict mode refuses to subclass `Any`. That is
# the last 25 of the 101 errors CI's install produced. Relaxed rather than solved, because the
# alternatives are worse: adding pydantic to `[dev]` makes a type-check dependency of a package
# that declares none, and a `# type: ignore` on every model class says the same thing 25 times
# without saying why. The models are validated by pydantic at runtime and covered by tests that
# assert real 422s, so the checking that matters is not being skipped here.
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "gpu: requires a GPU and model weights; excluded from CI via -m 'not gpu'",
]
